# 백엔드(Spring Boot) 테스트. 백엔드 코드가 바뀐 푸시·PR마다 돈다.
name: Backend test

on:
  push:
    paths:
      - 'backend/**'
      - '.github/workflows/backend-test.yml'
  pull_request:
    paths:
      - 'backend/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
        shell: bash -eo pipefail {0}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Test
        run: |
          chmod +x gradlew
          # gradle.properties의 org.gradle.java.home(로컬 Windows 경로)을 러너의 JDK로 덮어쓴다
          ./gradlew test --no-daemon -Dorg.gradle.java.home="$JAVA_HOME" 2>&1 | tee "$RUNNER_TEMP/test.log"

      # 실패하면 원인을 체크 주석으로 남긴다 — Actions 로그를 열지 않아도 보이게
      - name: Report failure
        if: failure()
        run: |
          python3 - <<'EOF'
          import glob, os, xml.etree.ElementTree as ET
          lines = []
          for f in glob.glob('build/test-results/test/*.xml'):
              for case in ET.parse(f).getroot().iter('testcase'):
                  for bad in list(case.findall('failure')) + list(case.findall('error')):
                      msg = (bad.get('message') or '') + '\n' + (bad.text or '')[:1500]
                      lines.append(f"{case.get('classname')}.{case.get('name')}: {msg}")
          if not lines:
              log = os.path.join(os.environ['RUNNER_TEMP'], 'test.log')
              if os.path.exists(log):
                  tail = [l for l in open(log, encoding='utf-8', errors='replace').read().splitlines() if l.strip()][-60:]
                  lines.append('\n'.join(tail))
          for l in lines[:10]:
              print('::error title=Backend test failed::' + l.replace('%', '%25').replace('\r', '').replace('\n', '%0A'))
          EOF
