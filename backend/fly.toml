# fly.toml app configuration file generated for intermap-backend on 2026-08-26T14:47:07+09:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'intermap-backend'
primary_region = 'nrt'

[build]
[env]
  JDBC_URL = 'jdbc:h2:file:/data/intermap'

[[mounts]]
  source = 'intermap_data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
