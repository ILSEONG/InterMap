spring.application.name=backend

# 배포 환경에서는 JDBC_URL 로 볼륨 경로를 지정한다 (예: jdbc:h2:file:/data/intermap)
spring.datasource.url=${JDBC_URL:jdbc:h2:file:./data/intermap}
spring.jpa.hibernate.ddl-auto=update

# 시간은 한국시간으로 저장한다. 엔티티는 Instant(절대 시각)를 그대로 쓰고, DB 칸은 시간대 없는 timestamp에
# 한국시간 벽시계 값(예: 2026-11-10 17:00:00)으로 넣고 읽는다. 기존 timestamptz 칸은 KstTimestamps가 시작 때 바꾼다.
spring.jpa.properties.hibernate.type.preferred_instant_jdbc_type=TIMESTAMP
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Seoul

# 유휴 연결을 남기지 않는다. 잠드는 DB(Neon 무료)를 깨워 두지 않으려던 설정인데,
# Supabase로 옮긴 뒤에도 연결을 적게 쥐는 편이 풀러 한도(아래)에 유리해 그대로 둔다.
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.idle-timeout=60000
spring.datasource.hikari.keepalive-time=0
# Supabase에는 세션 풀러(5432)로 붙는데, 한 계정이 동시에 열 수 있는 연결이 15개다.
# 재배포 때는 옛 서버와 새 서버가 잠깐 같이 떠 있으므로 서버 하나가 7개까지만 쓴다 (기본값 10이면 둘이 20개).
spring.datasource.hikari.maximum-pool-size=7

# 후기 사진 업로드 (한 장 2MB, 최대 10장 + JSON). 프론트가 1280px JPEG로 줄여 보내 보통 0.5MB 아래다.
# 크게 열어두면 요청 몇 개로 힙(256MB)과 저장 공간이 찬다.
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=21MB

# 사진 저장소 (Cloudflare R2 — storage/PhotoStore.java). 계정 ID, 버킷, API 토큰의 Access Key ID / Secret Access Key.
# 넷 다 있어야 켜진다. 비워두면 사진 바이트를 예전처럼 DB에 넣는다. 켜면 DB에 있던 사진도 서버 시작 때 R2로 옮긴다.
# 저장소가 공개라 값은 환경변수로만 준다.
r2.account-id=${R2_ACCOUNT_ID:}
r2.access-key-id=${R2_ACCESS_KEY_ID:}
r2.secret-access-key=${R2_SECRET_ACCESS_KEY:}
r2.bucket=${R2_BUCKET:}
# 주소를 직접 줄 때만 (EU 전용 버킷: https://<계정 ID>.eu.r2.cloudflarestorage.com). 비워두면 계정 ID로 만든다
r2.endpoint=${R2_ENDPOINT:}

# 관리자(주인장) 계정 비밀번호. 기본값 없음 — 배포 환경변수 ADMIN_PASSWORD 로만 준다 (AdminSeeder 참고).
admin.password=${ADMIN_PASSWORD:}
# 운영 관리자 이메일 (쉼표로 구분) — 이 계정들은 마이페이지에서 신고 관리·서버 상태를 볼 수 있다 (auth/Admins.java).
# 저장소가 공개라 값은 여기 적지 않고 환경변수로만 준다.
admin.emails=${ADMIN_EMAILS:}
# 앱 심사용 계정 (ReviewAccountSeeder). 비밀번호가 비어 있으면 만들지 않는다
review.account.email=${REVIEW_ACCOUNT_EMAIL:intermap0+review@gmail.com}
review.account.password=${REVIEW_ACCOUNT_PASSWORD:}

# 이메일 인증번호 발송 (Brevo HTTP API — Render 무료 티어는 SMTP 포트를 막는다). 비워두면 로그로만 찍는다.
# 발신 주소는 Brevo 콘솔 Senders에서 인증돼 있어야 한다.
brevo.api-key=${BREVO_API_KEY:}
mail.from=${MAIL_FROM:intermap0@gmail.com}

# 휴대폰 인증번호는 SMS로 발송 (SOLAPI). 발신번호는 솔라피 콘솔에 등록된 번호(숫자만). 비워두면 로그로만 찍는다.
solapi.api-key=${SOLAPI_API_KEY:}
solapi.api-secret=${SOLAPI_API_SECRET:}
solapi.from=${SOLAPI_FROM:}

# 푸시 알림 (Firebase Cloud Messaging). Firebase 콘솔 → 프로젝트 설정 → 서비스 계정에서 받은 키 JSON을 그대로(또는 base64로) 넣는다.
# 비워두면 푸시를 보내지 않는다 (앱 안 알림 목록은 그대로 동작).
fcm.service-account=${FCM_SERVICE_ACCOUNT:}

# 소셜 로그인 (OAuth2 인가 코드 플로우, 직접 구현)
oauth.google.client-id=${GOOGLE_CLIENT_ID:}
oauth.google.client-secret=${GOOGLE_CLIENT_SECRET:}
oauth.naver.client-id=${NAVER_LOGIN_CLIENT_ID:}
oauth.naver.client-secret=${NAVER_LOGIN_CLIENT_SECRET:}
oauth.kakao.client-id=${KAKAO_CLIENT_ID:}
oauth.kakao.client-secret=${KAKAO_CLIENT_SECRET:}
# Apple로 로그인 — Services ID, 팀 ID, 키 ID, 키 파일(.p8) 내용. 넷 다 있어야 켜진다 (auth/AppleLogin.java)
oauth.apple.client-id=${APPLE_CLIENT_ID:}
oauth.apple.team-id=${APPLE_TEAM_ID:}
oauth.apple.key-id=${APPLE_KEY_ID:}
oauth.apple.private-key=${APPLE_PRIVATE_KEY:}
# 각 provider 콘솔에 등록할 redirect_uri는 {backend-base-url}/api/auth/oauth/{provider}/callback
backend.base-url=${BACKEND_BASE_URL:http://localhost:8080}
frontend.base-url=${FRONTEND_BASE_URL:http://localhost:5173}

# 가게 좌표 보정용 네이버 지오코딩 (NCP 콘솔 > AI·NAVER API > Application 에서 Geocoding을 켠 앱의 Client ID / Secret).
# Render에 이미 있는 NAVER_SEARCH_CLIENT_ID/SECRET(같은 NCP 키)도 읽는다. 비워두면 인허가 좌표를 그대로 쓴다.
ncp.map.key-id=${NCP_MAP_KEY_ID:${NAVER_SEARCH_CLIENT_ID:}}
ncp.map.key=${NCP_MAP_KEY:${NAVER_SEARCH_CLIENT_SECRET:}}

# 인허가 데이터(LOCALDATA) 인증키 + 주간 음식점 최신화 대상 지자체 코드(쉼표 구분). 기본 = 서울 25개 구 전체
# 매주 목요일 22시(한국시간)에 새로 연 가게를 넣고, 폐업한 가게와 거기 달린 후기를 지운다 (localdata/RestaurantRefresh.java)
# 종로 중 용산 성동 광진 동대문 중랑 성북 강북 도봉 노원 은평 서대문 마포 양천 강서 구로 금천 영등포 동작 관악 서초 강남 송파 강동
localdata.auth-key=${LOCALDATA_AUTH_KEY:}
localdata.local-codes=${LOCALDATA_LOCAL_CODES:3000000,3010000,3020000,3030000,3040000,3050000,3060000,3070000,3080000,3090000,3100000,3110000,3120000,3130000,3140000,3150000,3160000,3170000,3180000,3190000,3200000,3210000,3220000,3230000,3240000}
