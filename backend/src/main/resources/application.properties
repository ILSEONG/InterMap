spring.application.name=backend

# 배포 환경에서는 JDBC_URL 로 볼륨 경로를 지정한다 (예: jdbc:h2:file:/data/intermap)
spring.datasource.url=${JDBC_URL:jdbc:h2:file:./data/intermap}
spring.jpa.hibernate.ddl-auto=update

# Neon 무료 compute는 5분간 쿼리가 없어야 잠든다. Hikari 기본값(유휴 연결 10개 + 2분 keepalive)이면
# Render 상시 가동 중 영원히 안 잠들어 월 100 CU-hour를 넘긴다. 유휴 연결을 남기지 않고 keepalive도 끈다.
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.idle-timeout=60000
spring.datasource.hikari.keepalive-time=0

# 후기 사진 업로드 (한 장 2MB, 최대 10장 + JSON). 프론트가 1280px JPEG로 줄여 보내 보통 0.5MB 아래다.
# 크게 열어두면 요청 몇 개로 힙(256MB)과 DB 저장 공간이 찬다.
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=21MB

# 관리자(주인장) 계정 비밀번호. 기본값 없음 — 배포 환경변수 ADMIN_PASSWORD 로만 준다 (AdminSeeder 참고).
admin.password=${ADMIN_PASSWORD:}

# 이메일 인증번호 발송 (Brevo HTTP API — Render 무료 티어는 SMTP 포트를 막는다). 비워두면 로그로만 찍는다.
# 발신 주소는 Brevo 콘솔 Senders에서 인증돼 있어야 한다.
brevo.api-key=${BREVO_API_KEY:}
mail.from=${MAIL_FROM:intermap0@gmail.com}

# 휴대폰 인증번호는 SMS로 발송 (SOLAPI). 발신번호는 솔라피 콘솔에 등록된 번호(숫자만). 비워두면 로그로만 찍는다.
solapi.api-key=${SOLAPI_API_KEY:}
solapi.api-secret=${SOLAPI_API_SECRET:}
solapi.from=${SOLAPI_FROM:}

# 소셜 로그인 (OAuth2 인가 코드 플로우, 직접 구현)
oauth.google.client-id=${GOOGLE_CLIENT_ID:}
oauth.google.client-secret=${GOOGLE_CLIENT_SECRET:}
oauth.naver.client-id=${NAVER_LOGIN_CLIENT_ID:}
oauth.naver.client-secret=${NAVER_LOGIN_CLIENT_SECRET:}
oauth.kakao.client-id=${KAKAO_CLIENT_ID:}
oauth.kakao.client-secret=${KAKAO_CLIENT_SECRET:}
# 각 provider 콘솔에 등록할 redirect_uri는 {backend-base-url}/api/auth/oauth/{provider}/callback
backend.base-url=${BACKEND_BASE_URL:http://localhost:8080}
frontend.base-url=${FRONTEND_BASE_URL:http://localhost:5173}

# localdata.go.kr 인증키 + 주간 상태 동기화 대상 지자체 코드(쉼표 구분). 기본 = 서울 25개 구 전체
# 종로 중 용산 성동 광진 동대문 중랑 성북 강북 도봉 노원 은평 서대문 마포 양천 강서 구로 금천 영등포 동작 관악 서초 강남 송파 강동
localdata.auth-key=${LOCALDATA_AUTH_KEY:}
localdata.local-codes=${LOCALDATA_LOCAL_CODES:3000000,3010000,3020000,3030000,3040000,3050000,3060000,3070000,3080000,3090000,3100000,3110000,3120000,3130000,3140000,3150000,3160000,3170000,3180000,3190000,3200000,3210000,3220000,3230000,3240000}
