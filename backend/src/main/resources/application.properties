spring.application.name=backend

# 배포 환경에서는 JDBC_URL 로 볼륨 경로를 지정한다 (예: jdbc:h2:file:/data/intermap)
spring.datasource.url=${JDBC_URL:jdbc:h2:file:./data/intermap}
spring.jpa.hibernate.ddl-auto=update

naver.search.client-id=${NAVER_SEARCH_CLIENT_ID:}
naver.search.client-secret=${NAVER_SEARCH_CLIENT_SECRET:}

# 이메일 인증번호 발송 (SMTP). 비워두면 개발 중처럼 로그로만 찍는다.
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
# 연결이 매달리면 요청이 영원히 안 끝나므로 타임아웃 필수
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

# 휴대폰 인증번호는 카카오 알림톡으로 발송 (NCP SENS Bizmessage).
# 사전에 NCP 콘솔에서 SENS 프로젝트 + 카카오톡 채널 연동 + 템플릿(#{code} 변수 포함) 승인이 필요하다.
ncp.sens.access-key=${NCP_SENS_ACCESS_KEY:}
ncp.sens.secret-key=${NCP_SENS_SECRET_KEY:}
ncp.sens.service-id=${NCP_SENS_SERVICE_ID:}
ncp.sens.plus-friend-id=${NCP_SENS_PLUS_FRIEND_ID:}
ncp.sens.template-code=${NCP_SENS_TEMPLATE_CODE:}

# 소셜 로그인 (OAuth2 인가 코드 플로우, 직접 구현)
oauth.google.client-id=${GOOGLE_CLIENT_ID:}
oauth.google.client-secret=${GOOGLE_CLIENT_SECRET:}
oauth.naver.client-id=${NAVER_LOGIN_CLIENT_ID:}
oauth.naver.client-secret=${NAVER_LOGIN_CLIENT_SECRET:}
oauth.kakao.client-id=${KAKAO_CLIENT_ID:}
oauth.kakao.client-secret=${KAKAO_CLIENT_SECRET:}
# 각 provider 콘솔에 등록할 redirect_uri는 {backend-base-url}/api/auth/oauth/{provider}/callback
backend.base-url=${BACKEND_BASE_URL:http://localhost:8080}
frontend.base-url=${FRONTEND_BASE_URL:http://localhost:5173}

# localdata.go.kr 인증키 + 동기화 대상 지자체 코드(쉼표 구분, 기본 3130000=서울 마포구)
localdata.auth-key=${LOCALDATA_AUTH_KEY:}
localdata.local-codes=${LOCALDATA_LOCAL_CODES:3130000}
