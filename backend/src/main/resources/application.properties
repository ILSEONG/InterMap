spring.application.name=backend

# 배포 환경에서는 JDBC_URL 로 볼륨 경로를 지정한다 (예: jdbc:h2:file:/data/intermap)
spring.datasource.url=${JDBC_URL:jdbc:h2:file:./data/intermap}
spring.jpa.hibernate.ddl-auto=update

naver.search.client-id=${NAVER_SEARCH_CLIENT_ID:}
naver.search.client-secret=${NAVER_SEARCH_CLIENT_SECRET:}

# localdata.go.kr 인증키 + 동기화 대상 지자체 코드(쉼표 구분, 기본 3130000=서울 마포구)
localdata.auth-key=${LOCALDATA_AUTH_KEY:}
localdata.local-codes=${LOCALDATA_LOCAL_CODES:3130000}
